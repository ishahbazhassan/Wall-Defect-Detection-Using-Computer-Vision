{% extends "base.html" %}
{% block content %}
<h3>Results (Job #{{ job.id }})</h3>
<p><strong>Defects detected:</strong> {{ job.defect_count }}</p>

<!-- Side-by-side Original & Processed Images -->
<div style="display: flex; gap: 20px; margin-top: 20px;">
    <div style="flex: 1; text-align: center;">
        <h4>Original Image</h4>
        <img src="{{ url_for('uploaded_file', filename=original_filename) }}" style="max-width: 100%; border: 1px solid #ccc;">
    </div>
    <div style="flex: 1; text-align: center;">
        <h4>Processed Image</h4>
        <img src="{{ url_for('processed_file', filename=processed_filename) }}" style="max-width: 100%; border: 1px solid #ccc;">
    </div>
</div>

<p style="margin-top: 20px;">
    <a href="{{ url_for('home') }}">Upload another image</a>
</p>
{% endblock %}
